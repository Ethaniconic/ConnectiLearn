name: ConnectiLearn CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  client-verification:
    name: Frontend (React & Vite) Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Connecti-learn/client/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./Connecti-learn/client

      - name: Compile & Build Frontend Bundle
        run: npm run build
        working-directory: ./Connecti-learn/client

  server-verification:
    name: Backend (FastAPI & LangGraph) Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./Connecti-learn/server

      - name: Static Code Syntax Compilation Check
        run: python -m compileall .
        working-directory: ./Connecti-learn/server
